name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Data refresh']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Overlay published card data from data-refresh
        id: published_data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data-refresh
          path: _published_data
          sparse-checkout: |
            public/data
            public/card-images
          sparse-checkout-cone-mode: false

      - name: Copy published data into dist
        if: steps.published_data.outcome == 'success'
        run: |
          mkdir -p dist/data dist/card-images
          cp -a _published_data/public/data/. dist/data/
          if [ -d _published_data/public/card-images ]; then
            cp -a _published_data/public/card-images/. dist/card-images/
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test (deployed site)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify published catalog on Pages
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run pages:smoke-data

      - name: Smoke test against Pages URL
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          CI: 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run test:e2e -- e2e/smoke.spec.ts; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Smoke failed (attempt ${attempt}/5); retrying after Pages propagation…"
              sleep 15
            fi
          done
          exit 1
